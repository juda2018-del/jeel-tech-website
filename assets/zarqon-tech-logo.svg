<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
<title id="title">ZARQON TECH ribbon emblem</title>
<desc id="desc">Blue arched ribbon with a silver crossing ribbon, matching the approved ZARQON TECH brand concept.</desc>
<defs>
 <linearGradient id="blue" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#18E4FF"/><stop offset=".38" stop-color="#078BFF"/><stop offset=".78" stop-color="#0066FF"/><stop offset="1" stop-color="#0341B8"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".45" stop-color="#E0E8F4"/><stop offset="1" stop-color="#7E96B6"/></linearGradient>
 <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#002D75"/><stop offset="1" stop-color="#07162C"/></linearGradient>
</defs>
<!-- Main rising blue ribbon / arch -->
<path d="M8 83 39 28C45 17 53 7 61 11 68 14 73 28 80 39L109 81C114 89 108 96 99 99L85 104 57 62 43 83C36 95 29 101 19 98 8 95 3 90 8 83Z" fill="url(#blue)"/>
<!-- Dark folded underside gives the ribbon depth -->
<path d="M57 62 75 48 95 78 108 84Q112 91 101 97L85 104 57 62Z" fill="url(#shadow)" opacity=".72"/>
<!-- Silver ribbon crosses in front and sweeps up from the left -->
<path d="M8 83C19 74 31 66 43 58L54 51 70 70C78 79 88 85 103 88L88 96C75 92 64 83 54 72L44 61 22 91C16 96 8 92 8 83Z" fill="url(#silver)"/>
<!-- Highlight edge on the crossing ribbon -->
<path d="M11 82C23 73 34 65 44 59L50 63C37 72 25 82 16 89Z" fill="#FFFFFF" opacity=".8"/>
<!-- Blue front fold that reconnects the symbol -->
<path d="M43 58 54 51 70 70 83 82 72 87 55 70 44 61 30 82 22 91 17 89 39 61Z" fill="url(#blue)"/>
<!-- Cyan rim highlight -->
<path d="M45 24C50 15 55 11 60 13 66 15 70 26 76 36L103 76" fill="none" stroke="#49E8FF" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>
</svg>